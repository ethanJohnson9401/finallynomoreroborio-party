
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Public Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint repository
        run: npm run lint

      - name: Build public website
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.finallynomoreroborio.party
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

  public-api:
    name: Public API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify integration migration consistency
        run: |
          cmp migrations/0001_create_incidents.sql ../integration/migrations/0001_create_incidents.sql
          cmp ../admin-worker/migrations/0002_create_moderation_audit.sql ../integration/migrations/0002_create_moderation_audit.sql
          cmp migrations/0003_add_incident_test_flag.sql ../integration/migrations/0003_add_incident_test_flag.sql
          cmp migrations/0004_add_submission_idempotency.sql ../integration/migrations/0004_add_submission_idempotency.sql
          cmp migrations/0005_add_incident_withdrawals.sql ../integration/migrations/0005_add_incident_withdrawals.sql

      - name: TypeScript
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test -- --run

  admin-api:
    name: Admin API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Unit and integration tests
        run: npm test -- --run

  admin-dashboard:
    name: Admin Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build
        env:
          NEXT_PUBLIC_MODERATION_WRITES_ENABLED: "true"
